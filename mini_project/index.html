<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">

    <script src="script.js" defer></script>

    <title>Tornado To-Dos</title>

    <link
        rel="icon"
        type="image/png"
        href="https://img.icons8.com/fluent/1200/microsoft-todo-2019.jpg"
    >
</head>

<body>

    <div class="parentdiv">

        <section>
            <div class="inpdiv">

                <input
                    class="inp"
                    type="text"
                    placeholder="Enter a task"
                    id="todoInput"
                >

                <button class="button" id="add">
                    Add
                </button>

                <button class="button" id="clear">
                    Clear All
                </button>

            </div>
        </section>


  
        <div class="todos">
            <div class="todocontainer" id="todoContainer"></div>
        </div>

    </div>

</body>

</html>
